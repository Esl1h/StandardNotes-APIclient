name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify version matches tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Assemble extension package
        run: |
          # The desktop app auto-updates by comparing the version in
          # latest_url (ext.json) against the installed one; rewrite both
          # version and download_url with the tag so a tag bump alone
          # updates clients. Patching build/ keeps the zip and the Pages
          # deploy consistent.
          VERSION=${GITHUB_REF_NAME#v}
          TAG=${GITHUB_REF_NAME}
          node -e "
            const fs = require('fs');
            const extPath = 'build/ext.json';
            const ext = JSON.parse(fs.readFileSync(extPath, 'utf8'));
            ext.version = '$VERSION';
            ext.download_url = 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/download/$TAG/extension.zip';
            fs.writeFileSync(extPath, JSON.stringify(ext, null, 2) + '\n');
            const pkg = {
              name: 'standardnotes-apiclient',
              version: '$VERSION',
              description: 'HTTP API client editor for Standard Notes, using .http syntax',
              private: true,
              license: 'AGPL-3.0-or-later',
              sn: { main: 'index.html' },
            };
            fs.writeFileSync('build/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          mkdir -p dist-pkg
          cp -r build/* dist-pkg/
          cd dist-pkg && zip -qr ../extension.zip . && cd ..

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" extension.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REPO" pages
            rsync -a --delete --exclude .git build/ pages/
            cd pages
            git add -A
            git diff --cached --quiet || git commit -m "Deploy ${GITHUB_REF_NAME}"
            git push
          else
            mkdir pages
            rsync -a --delete --exclude .git build/ pages/
            cd pages
            git init -b gh-pages
            git add -A
            git commit -m "Deploy ${GITHUB_REF_NAME}"
            git push "$REPO" gh-pages
          fi
