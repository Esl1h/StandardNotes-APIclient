name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Creates the release and pushes gh-pages; signs the provenance of
    # extension.zip with the workflow identity.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The push steps carry their own token; none is left in .git/config
        # for the build and test steps to read.
        with:
          # git-cliff needs the tags and the history between them.
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify version matches tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Check version sync
        run: npm run version:check

      # This job can write to the repository; no dependency needs its
      # install scripts to build or test.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check build contents
        run: npm run check:build

      - name: Assemble extension package
        run: |
          export VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist-pkg
          cp -r build/* dist-pkg/
          node -e "
            const fs = require('fs');
            const pkg = {
              name: 'standardnotes-apiclient',
              version: process.env.VERSION,
              description: 'HTTP API client editor for Standard Notes, using .http syntax',
              private: true,
              license: 'AGPL-3.0-or-later',
              sn: { main: 'index.html' },
            };
            fs.writeFileSync('dist-pkg/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cd dist-pkg && zip -qr ../extension.zip . && cd ..

      - name: Write release notes
        run: npx git-cliff --latest --strip header -o release-notes.md

      - name: Write checksums
        run: sha256sum extension.zip > SHA256SUMS

      # Lets anyone check that extension.zip was built by this workflow
      # from this tag: gh attestation verify extension.zip -R <repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: extension.zip

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" extension.zip SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git asks gh for the token, so it is never written into a URL.
          gh auth setup-git
          REPO="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REPO" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REPO" pages
            rsync -a --delete --exclude .git build/ pages/
            cd pages
            git add -A
            git diff --cached --quiet || git commit -m "Deploy ${GITHUB_REF_NAME}"
            git push
          else
            mkdir pages
            rsync -a --delete --exclude .git build/ pages/
            cd pages
            git init -b gh-pages
            git add -A
            git commit -m "Deploy ${GITHUB_REF_NAME}"
            git push "$REPO" gh-pages
          fi
