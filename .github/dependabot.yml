version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      codemirror:
        patterns: ['@codemirror/*', 'codemirror']
      # @eslint/js majors require the matching eslint major.
      eslint:
        patterns: ['eslint', '@eslint/*']
    ignore:
      # React 19: @standardnotes/stylekit (5.29.3) peers on React 18.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # TypeScript 7: typescript-eslint supports TypeScript below 6.1.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # The Node types follow the Node version CI runs (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
